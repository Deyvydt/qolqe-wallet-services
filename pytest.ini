# QUÉ ES: configuración de pytest (el ejecutor de pruebas).
# - pythonpath / testpaths: dónde está el código y dónde buscar pruebas (venían del curso).
# - bdd_features_base_dir: carpeta de los .feature para pytest-bdd (agregado).
# - markers: las etiquetas de los .feature (@funcional, @E7, @HU-G2-03...) registradas, así
#   pytest no avisa "marca desconocida" y se puede filtrar: pytest -m "tecnico and E7".
# - filterwarnings: oculta solo las advertencias de obsolescencia de librerías externas.
[pytest]
pythonpath = .
testpaths = tests
bdd_features_base_dir = features
markers =
    funcional: caso funcional (regla de negocio / criterio de aceptación)
    tecnico: caso técnico (autenticación, validación de entrada, contrato, método HTTP)
    seguridad: subtipo técnico, autenticación y propiedad de los datos
    contrato: subtipo técnico, estructura de la respuesta según el contrato OpenAPI
    E1: GET /api/servicios/empresas
    E2: GET /api/servicios/deudas
    E3: POST /api/servicios/pagos
    E4: GET /api/servicios/pagos
    E5: GET /api/servicios/pagos/{codigo_operacion}
    E6: GET /api/servicios/afiliaciones
    E7: POST /api/servicios/afiliaciones
    E8: PUT /api/servicios/afiliaciones/{id}
    E9: DELETE /api/servicios/afiliaciones/{id}
    E10: POST /api/pruebas/procesar-diario (proceso diario de débitos)
    N1: POST /api/usuarios (registro)
    N2: POST /api/auth/login
    N3: POST /api/auth/logout
    N4: GET /api/cuentas/me
    N5: PUT /api/cuentas/me
    N6: GET /api/cuentas/me/saldo
    N7: POST /api/cuentas/me/cierre
    N8: POST /api/transferencias
    N9: GET /api/transferencias/comision
    nucleo: núcleo común (HU-N-01 a HU-N-09)
    HU-N-01: Registrarme
    HU-N-02: Iniciar sesión
    HU-N-03: Cerrar sesión
    HU-N-04: Consultar mi saldo y perfil
    HU-N-05: Editar mi perfil
    HU-N-06: Cerrar mi cuenta
    HU-N-07: Transferir a otro usuario Qolqe
    HU-N-08: Transferir a otro banco
    HU-N-09: Simular la comisión
    CA5: criterio de aceptación 5
    CA6: criterio de aceptación 6
    RN-01: DNI de 8 dígitos
    RN-02: celular de 9 dígitos que empieza con 9, único
    RN-03: PIN de 4 dígitos, no repetido ni secuencial
    RN-04: bloqueo tras 3 intentos fallidos consecutivos
    RN-05: monto mayor a 0, 2 decimales, máximo S/ 500.00
    RN-06: límite diario de transferencias
    RN-07: no a uno mismo, a no registrados ni a cuentas cerradas
    RN-09: comisión interbancaria 1.5 % (mín. 1.00, máx. 5.00)
    G2: módulo G2 Pago de servicios
    HU-G2-01: Consultar deudas
    HU-G2-02: Pagar una deuda
    HU-G2-03: Afiliar un servicio
    HU-G2-04: Ver mis servicios afiliados
    HU-G2-05: Editar afiliación y débito automático
    HU-G2-06: Desafiliar un servicio
    HU-G2-07: Ver mis pagos y comprobantes
    CA1: criterio de aceptación 1
    CA2: criterio de aceptación 2
    CA3: criterio de aceptación 3
    CA4: criterio de aceptación 4
    R-G2-01: suministro de 8 a 12 dígitos
    R-G2-03: mora 0.5 % diario con tope 10 %
    R-G2-04: más de 60 días pasa a cobranza
    R-G2-05: máximo 8 afiliaciones sin repetir
    RN-08: el saldo nunca queda negativo (cubre monto más comisión)
    RN-10: toda operación genera un movimiento
    camino-feliz: técnica, flujo principal
    particion: técnica, partición de equivalencia
    valor-limite: técnica, análisis de valores límite
    efecto: técnica, efecto colateral verificado
    concurrencia: técnica, operaciones simultáneas
    actor-sistema: el actor es el proceso diario
    schemathesis: prueba técnica generada con Schemathesis desde el contrato OpenAPI
filterwarnings =
    ignore::DeprecationWarning
