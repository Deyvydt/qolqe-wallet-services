# TEMPORAL: prueba rápida del endpoint de GitHub Models desde el runner (se borra después).
name: Probar modelo
on:
  push:
    branches: [entrega-final]
    paths: [".github/workflows/probar-modelo.yml"]
permissions:
  contents: read
  models: read
jobs:
  probar:
    runs-on: ubuntu-24.04
    steps:
      - name: Llamar al modelo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== catalogo"
          curl -s -m 30 -w "\nHTTP %{http_code} %{content_type}\n" https://models.github.ai/catalog/models -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" | head -c 500
          for m in openai/gpt-4o-mini openai/gpt-4.1-mini openai/gpt-4.1; do
            echo
            echo "== $m"
            curl -s -m 40 -w "\nHTTP %{http_code} %{content_type}\n" https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"di hola en una palabra\"}]}" | head -c 400
          done
