# QUÉ ES: workflow REUTILIZABLE con las pruebas de API del módulo G2.
# QUIÉN LO USA: pruebas.yml (con "uses: ./.github/workflows/_api.yml").
# QUÉ HACE, en una máquina limpia de GitHub (runner Ubuntu):
#   1. descarga el código e instala Python y las librerías de prueba;
#   2. corre pytest: escenarios Gherkin (pytest-bdd) funcionales y técnicos de E1..E10. El contrato
#      (Schemathesis) corre ANTES, en _contrato.yml;
#      los defectos conocidos (DEF-01..04 y DEF-07..14) están como "fallo esperado" estricto;
#   3. deja la evidencia: JUnit XML (para herramientas), HTML (para personas) y un
#      resumen en la página del run; y sube todo como artefacto descargable.
# No hace falta levantar la app: pytest usa TestClient y Schemathesis la levanta sola.
name: API (reutilizable)

on:
  workflow_call:

jobs:
  api:
    name: API · pytest-bdd
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar las pruebas de API
        run: >-
          pytest --ignore=tests/tecnico --ignore=tests/triaje --ignore=tests/qase
          --junitxml=reportes/api/junit.xml
          --html=reportes/api/reporte.html --self-contained-html

      - name: Pruebas unitarias de las herramientas del pipeline (triaje y Qase)
        run: pytest tests/triaje tests/qase -q

      - name: Resumen en la página del run
        if: ${{ !cancelled() }}
        run: python .github/scripts/resumen.py reportes/api/junit.xml --titulo "Pruebas de API (pytest-bdd)"

      - name: Guardar los reportes como artefacto
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reportes-api
          path: reportes/api
          retention-days: 30
