# QUÉ ES: fragmento SUGERIDO para agregar al final de "jobs:" en .github/workflows/pruebas.yml.
# Job "triaje-ia": cuando termina la API y la web (pasen o fallen), descarga sus reportes y corre
# el agente de triaje (.github/scripts/triaje_ia.py) con un LLM de GitHub Models.
# - if: always()             → corre también cuando las pruebas fallaron (es justo cuando sirve).
# - continue-on-error: true  → nunca pone rojo el pipeline: el quality gate lo deciden las pruebas.
# - permissions models: read → el GITHUB_TOKEN del run puede llamar a GitHub Models (sin secretos extra).
# Resultado: tabla "Triaje de fallas (IA)" en la página del run + artefacto triaje-ia (JSON).

  triaje-ia:
    name: Triaje de fallas (IA)
    needs: [api, web]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      models: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
        with:
          fetch-depth: 2   # para que la herramienta ver_diff_commit (git show HEAD) tenga el commit

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Descargar los reportes de la API
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: reportes-api
          path: reportes

      - name: Descargar los reportes web
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: reportes-web
          path: reportes/web

      - name: Triaje de las fallas con el agente IA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIAJE_MODELO: openai/gpt-4.1-mini
        run: >-
          python .github/scripts/triaje_ia.py
          reportes/api/junit.xml reportes/web/output.xml
          --json reportes/triaje/triaje.json

      - name: Guardar el triaje como artefacto
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: triaje-ia
          path: reportes/triaje
          if-no-files-found: ignore
          retention-days: 30
